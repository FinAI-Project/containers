name: Builds Docker image and push to Docker Hub

on:
  workflow_call:
    inputs:
      build_context:
        type: string
        default: .
      build_file:
        type: string
      image_name:
        required: true
        type: string
      image_tag:
        type: string
        default: latest
    secrets:
      DOCKERHUB_USERNAME:
        required: true
      DOCKERHUB_TOKEN:
        required: true

jobs:
  build:
    runs-on:
      group: ArcCI
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Generate .dockerignore
        run: |
          cat > ${{ inputs.build_context }}/.dockerignore << 'EOF'
          requirements-*.txt
          *.Dockerfile
          !requirements-${{ inputs.image_tag }}.txt
          !${{ inputs.image_tag }}.Dockerfile
          EOF

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ inputs.image_name }}
          tags: |
            type=raw,value=${{ inputs.image_tag }}

      - name: Build Docker image
        id: build
        uses: docker/build-push-action@v7
        env:
          DOCKER_BUILD_RECORD_UPLOAD: false
          DOCKER_BUILD_RECORD_RETENTION_DAYS: 3
        with:
          context: ${{ inputs.build_context }}
          file: ${{ inputs.build_file }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GIT_COMMIT=${{ github.sha }}
