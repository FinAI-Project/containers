name: Build Compass Runtime

on:
  push:
    paths:
      - compass-runtime/**

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      has_changes: ${{ steps.matrix.outputs.has_changes }}
    steps:
      - uses: actions/checkout@v7

      - uses: dorny/paths-filter@v4
        id: filter
        with:
          base: ${{ github.ref }}
          filters: |
            v3:
              - 'compass-runtime/v3.Dockerfile'
              - 'compass-runtime/requirements-v3.txt'
              - 'compass-runtime/*.py'
              - 'compass-runtime/bin/*'
            v4:
              - 'compass-runtime/v4.Dockerfile'
              - 'compass-runtime/requirements-v4.txt'
              - 'compass-runtime/*.py'
              - 'compass-runtime/bin/*'

      - name: Generate Docker build matrix
        id: matrix
        shell: bash
        env:
          V3_CHANGED: ${{ steps.filter.outputs.v3 }}
          V4_CHANGED: ${{ steps.filter.outputs.v4 }}
        run: |
          matrix='{"include":[]}'

          if [[ "$V3_CHANGED" == "true" ]]; then
            matrix=$(jq -c \
              '.include += [{
                "tag": "v3",
                "dockerignore": "v4"
              }]' <<< "$matrix")
          fi

          if [[ "$V4_CHANGED" == "true" ]]; then
            matrix=$(jq -c \
              '.include += [{
                "tag": "v4",
                "dockerignore": "v3"
              }]' <<< "$matrix")
          fi

          if [[ "$matrix" == '{"include":[]}' ]]; then
            has_changes=false
          else
            has_changes=true
          fi

          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "has_changes=$has_changes" >> "$GITHUB_OUTPUT"
          echo "Generated matrix: $matrix"

  docker:
    needs: changes
    if: ${{ needs.changes.outputs.has_changes == 'true' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.matrix) }}
    uses: ./.github/workflows/docker-build.yml
    with:
      build_context: compass-runtime
      build_file: compass-runtime/${{ matrix.tag }}.Dockerfile
      image_name: fengheai/compass-runtime
      image_tag: ${{ matrix.tag }}
      dockerignore: ${{ matrix.dockerignore }}
    secrets: inherit